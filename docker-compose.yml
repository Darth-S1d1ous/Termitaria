name: termitaria

# Termitaria 本地基础设施（架构 §3-5 的存储与总线依赖）
# 启动：docker compose up -d ｜ 验证见 docs/contracts.md §8 与 README

services:
  # Bus：三条 JetStream stream（sessions.* / tasks.* / memory.*）的载体
  nats:
    image: nats:2.11-alpine
    command: ["--jetstream", "--store_dir", "/data", "--http_port", "8222"]
    ports:
      - "4222:4222"   # client
      - "8222:8222"   # monitoring（http://localhost:8222/varz）
    volumes:
      - nats-data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8222/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Knowledge Graph：属性图（Redis 协议 + Cypher）
  falkordb:
    image: falkordb/falkordb:latest
    ports:
      - "6379:6379"   # Redis 协议端
      - "3000:3000"   # FalkorDB Browser（http://localhost:3000）
    volumes:
      - falkor-data:/data

  # Agent Memory 的结构化部分（role / rules / episode 元数据）
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: termitaria
      POSTGRES_PASSWORD: termitaria
      POSTGRES_DB: termitaria
    ports:
      - "5432:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U termitaria"]
      interval: 5s
      timeout: 3s
      retries: 10

  # 记忆召回的候选生成（欧氏近邻；最终排序由 Poincaré 距离完成）
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"   # REST
      - "6334:6334"   # gRPC
    volumes:
      - qdrant-data:/qdrant/storage

volumes:
  nats-data:
  falkor-data:
  pg-data:
  qdrant-data:
