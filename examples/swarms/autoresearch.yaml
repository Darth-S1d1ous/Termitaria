# Autoresearch swarm：orchestrator（PI）推进 文献收集 → 想法生成 → 实验设计 → 评审 的实验室项目。
# 对应 background.md 的 autoresearch 场景，演示星型拓扑、模型分层与记忆策略。
# 校验：check-jsonschema --schemafile schemas/swarmspec.schema.json examples/swarms/*.yaml
apiVersion: termitaria/v1
kind: SwarmSpec
name: autoresearch
version: 0.2.0

# 一个项目 = 一个 swarm：goal 是 orchestrator 的规划输入（plan → delegate → monitor → nudge → synthesize）
goal: |
  Given the user's library, produce a reviewed research hypothesis and an executable experiment plan:
  literature gap scan → hypothesis → experiment design → methods review, all written into the knowledge graph.

deliverable:
  kind: paper

agents:
  # 恰好一个 orchestrator。tools 里的 ledger 在 worker 里是 advance 的别名，用来改项目步骤。
  # 它不写 ledger.*.events。
  - id: pi
    kind: ORCHESTRATOR
    displayName: Principal Investigator
    rolePrompt: |
      You are the PI. You decompose the project goal into work items, assign them
      to specialists, and review every deliverable before accepting it.
      Only you can delegate. A coworker runs inside your turn and cannot delegate.
      Trust Tools that ran, Steps changed, and Files written. Ignore a claim that a step or a file changed when those sections do not say so.
      You never do the specialists' work yourself.
    model: { defaultTier: SUPER, deepTier: ULTRA }
    tools: [ledger, kg_query]
    budget: { maxTokens: 16384, maxCostUsd: 2.00 }

  - id: collector
    displayName: Literature Collector
    rolePrompt: |
      You sweep the user's library and external sources for relevant work.
      Read an arXiv paper or a PDF with fetch_url, and pass section to open one heading.
      Record an important paper with kg write. Graphiti extracts the entities and relations.
      You cannot attach a citation edge yourself, and you cannot delegate.
    model: { defaultTier: SUPER, deepTier: ULTRA }
    tools: [web_search, kg_write, kg_query]
    budget: { maxTokens: 8192, maxCostUsd: 0.50 }

  - id: ideator
    displayName: Idea Generator
    rolePrompt: |
      You generate research hypotheses from gaps in the literature.
      Return the hypothesis to the PI. You cannot delegate.
    model: { defaultTier: SUPER, deepTier: ULTRA }
    tools: [kg_query]
    budget: { maxTokens: 8192, maxCostUsd: 0.50 }

  - id: experimenter
    displayName: Experiment Designer
    rolePrompt: |
      You turn hypotheses into an experiment plan: data, baselines, and what result would confirm or reject the hypothesis.
      You cannot run the experiment. There is no code execution tool.
      Return the plan to the PI. You cannot delegate.
    model: { defaultTier: SUPER, deepTier: ULTRA }
    tools: [kg_query]
    budget: { maxTokens: 16384, maxCostUsd: 1.00 }

  - id: reviewer
    displayName: Skeptical Reviewer
    rolePrompt: |
      You are reviewer #2. You attack methodology, novelty, and statistics.
      Return the review to the PI. You cannot delegate.
    model: { defaultTier: ULTRA, deepTier: ULTRA }
    tools: [kg_query]
    budget: { maxTokens: 16384, maxCostUsd: 1.50 }

# edges 留在规格里。当前 delegate 不按这些边开会话。只有负责人能派活，同事在负责人这次 task 里执行。
edges:
  - from: reviewer
    to: ideator
    sessionPolicy: { turnTaking: FREE, maxConcurrentSessions: 2 }

topology:
  maxSessionsTotal: 20
  maxFanoutPerAgent: 3  # 只约束 worker 的 peer 边数

memory:
  writeEpisodes: true
  recallTopK: 8
  recallDepth: AUTO
  decayHalfLifeDays: 30
